<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Title, description, canonical and Open Graph tags are written in here per
      route at build time by the seo plugin in vite.config.ts, so a shared link
      to a case study unfurls as that case study. In dev the marker stays as it
      is and React sets the title on its own.
    -->
    <!--seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: CI

# Pull requests are the gate into main, and main is what Vercel deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The suite launches its own production build and server, so the
      # build above is a separate signal: it fails on its own if the bundle
      # breaks, rather than being reported as a webServer timeout.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
